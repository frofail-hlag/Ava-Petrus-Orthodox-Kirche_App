<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#082b59">
<meta name="description" content="St. Petrus Koptisch-Orthodoxe Kirche Hamburg — App V1.2 Design Prototype">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<title>St. Petrus Hamburg — App V1.2</title>
</head>
<body>
<div class="app-shell">
<header class="topbar">
  <div class="brand"><div class="cross-mark">✣</div><div><div class="brand-name">St. Petrus</div><div class="brand-sub">Koptisch-Orthodoxe Kirche Hamburg</div></div></div>
  <div class="top-actions"><button class="icon-btn" aria-label="Benachrichtigungen">♧<span class="dot"></span></button><button class="icon-btn" onclick="go('profile')" aria-label="Profil">●</button></div>
</header>
<main id="screen"></main>
<nav class="bottom-nav">
  <button data-route="home" onclick="go('home')"><span>⌂</span><small>Home</small></button>
  <button data-route="church" onclick="go('church')"><span>♜</span><small>Kirche</small></button>
  <button data-route="spiritual" onclick="go('spiritual')"><span>✚</span><small>Spiritual</small></button>
  <button data-route="media" onclick="go('media')"><span>▶</span><small>Medien</small></button>
  <button data-route="community" onclick="go('community')"><span>♧</span><small>Community</small></button>
</nav>
</div>
<script src="app.js"></script>
</body>
</html>
